<!doctype html>
<html lang="en">
  <head>
    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#171717"
    />

    <!-- Primary Meta Tags -->
    <title>Mutia Nandhika's Portfolio</title>

    <meta
      name="title"
      content="Mutia Nandhika's Portfolio"
    />

    <meta
      name="description"
      content="Welcome to Mutia Nandhika's portfolio. Explore selected projects, experience, skills, and digital work."
    />

    <meta
      name="keywords"
      content="Mutia Nandhika, portfolio, UI/UX Design, Software Engineering, Graphic Design, Figma, Laravel, PHP, JavaScript, Vue.js, Flutter, MySQL, Web Development"
    />

    <meta
      name="author"
      content="Mutia Nandhika"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="language"
      content="English"
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://portfolio-mutia-nandhika.vercel.app/"
    />

    <meta
      property="og:title"
      content="Mutia Nandhika's Portfolio"
    />

    <meta
      property="og:description"
      content="Welcome to Mutia Nandhika's portfolio. Explore selected projects, experience, skills, and digital work."
    />

    <meta
      property="og:image"
      content="https://portfolio-mutia-nandhika.vercel.app/logo.png"
    />

    <meta
      property="og:site_name"
      content="Mutia Nandhika's Portfolio"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:url"
      content="https://portfolio-mutia-nandhika.vercel.app/"
    />

    <meta
      name="twitter:title"
      content="Mutia Nandhika's Portfolio"
    />

    <meta
      name="twitter:description"
      content="Welcome to Mutia Nandhika's portfolio. Explore selected projects, experience, skills, and digital work."
    />

    <meta
      name="twitter:image"
      content="https://portfolio-mutia-nandhika.vercel.app/logo.png"
    />

    <!-- Additional SEO -->
    <meta
      name="msapplication-TileColor"
      content="#171717"
    />

    <link
      rel="canonical"
      href="https://portfolio-mutia-nandhika.vercel.app/"
    />

    <!-- Preconnect to Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Critical CSS -->
    <style>
      /* Critical above-the-fold CSS */

      #root {
        min-height: 100vh;
        background:
          linear-gradient(
            135deg,
            #0a0a0a 0%,
            #171717 50%,
            #0a0a0a 100%
          );
      }

      .preloader {
        position: fixed;
        inset: 0;
        background: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid #374151;
        border-top: 2px solid #f59e0b;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- React Root -->
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .catch(() => {
              // Fail silently if service worker registration fails
            });
        });
      }
    </script>

    <!-- React Application -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
